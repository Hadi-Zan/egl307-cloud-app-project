services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

    stdin_open: true
    tty: true

  tests:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      - CI=true

    command: ["npm", "test", "--", "--watchAll=false"]